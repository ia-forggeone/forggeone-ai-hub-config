# litellm_settings na raiz do documento
litellm_settings:
  drop_params: true
  request_timeout: 120
  cache: false
  max_parallel_requests: 50
  hide_secrets: true

# Rate limiting por usuário
router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 120